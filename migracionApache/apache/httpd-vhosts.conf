<VirtualHost *:80>
    ServerName inventario.local
    DocumentRoot /usr/local/apache2/htdocs

    <Directory /usr/local/apache2/htdocs>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Proxy: /api/ → contenedor inventario-node (puerto 3001, misma red RedColmena)
    ProxyPreserveHost On
    ProxyPass        /api/ http://inventario-node:3001/api/
    ProxyPassReverse /api/ http://inventario-node:3001/api/

    # SPA fallback: rutas sin archivo → index.html
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteRule ^ /index.html [L]
</VirtualHost>
