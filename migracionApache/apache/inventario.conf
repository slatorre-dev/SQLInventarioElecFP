<VirtualHost *:80>
    ServerName inventario.local
    # Ajusta DocumentRoot a la ruta real en Ubuntu:
    DocumentRoot /var/www/inventario/public

    <Directory /var/www/inventario/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Proxy: redirige /api/* al servidor Node.js Express
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:3000/api/
    ProxyPassReverse /api/ http://127.0.0.1:3000/api/

    # SPA: todas las rutas que no sean archivos estáticos van a index.html
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteRule ^ /index.html [L]

    ErrorLog ${APACHE_LOG_DIR}/inventario_error.log
    CustomLog ${APACHE_LOG_DIR}/inventario_access.log combined
</VirtualHost>
